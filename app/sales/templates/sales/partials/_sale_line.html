<article class="dn-sale-line"
         data-sale-line
         data-line-index="{{ line_index }}">

  <div class="dn-sale-line-main">
    <label class="dn-field dn-product-field">
      <span>Producto</span>
      <select name="product_id[]"
              required
              class="dn-product-select">
        <option value="">Selecciona un café o producto</option>

        {% for product in products %}
        <option value="{{ product.id }}"
                data-default-unit-id="{{ product.effective_sales_unit_id }}"
                data-sku="{{ product.sku }}">
          {{ product.sku }} · {{ product.name }}
        </option>
        {% endfor %}
      </select>
    </label>

    <label class="dn-field">
      <span>Cantidad</span>
      <input name="quantity[]"
             type="number"
             min="0.0001"
             step="0.0001"
             value="1"
             required
             class="dn-quantity-input">
    </label>

    <label class="dn-field">
      <span>Unidad</span>
      <select name="unit_id[]"
              required
              class="dn-unit-select">
        <option value="">Selecciona</option>

        {% for unit in units %}
        <option value="{{ unit.id }}">
          {{ unit.display_name }}
        </option>
        {% endfor %}
      </select>
    </label>

    <label class="dn-field">
      <span>Precio unitario</span>
      <input name="unit_price[]"
             type="number"
             min="0"
             step="0.01"
             required
             placeholder="Precio sugerido"
             class="dn-unit-price-input">
    </label>

    <label class="dn-field">
      <span>Descuento</span>
      <div class="dn-input-suffix">
        <input name="discount_pct[]"
               type="number"
               min="0"
               max="100"
               step="0.01"
               value="0"
               class="dn-discount-input">
        <span>%</span>
      </div>
    </label>

    <button type="button"
            class="dn-remove-line"
            aria-label="Eliminar producto"
            title="Eliminar producto"
            onclick="this.closest('[data-sale-line]').remove(); document.body.dispatchEvent(new Event('sale:changed'));">
      ×
    </button>
  </div>

  <footer class="dn-line-impact">
    <p class="dn-line-note">
      El precio final se valida nuevamente en el servidor al guardar.
    </p>

    <div class="dn-line-total">
      <span>Impacto de esta línea</span>
      <strong data-line-total>$0 COP</strong>
    </div>
  </footer>
</article>
