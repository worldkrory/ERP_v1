<div class="production-manual-cost-row card card-subtle">
    <div class="input-row-header">
        <h3>Costo adicional #{{ row_index + 1 }}</h3>

        <button
            type="button"
            class="button button-danger button-small"
            onclick="this.closest('.production-manual-cost-row').remove()">
            Quitar
        </button>
    </div>

    <div class="form-grid">
        <div class="field">
            <label for="manual_costs-{{ row_index }}-cost_type">
                Tipo de costo
            </label>

            <select
                id="manual_costs-{{ row_index }}-cost_type"
                name="manual_costs-{{ row_index }}-cost_type"
                required>
                <option value="">Selecciona un tipo</option>

                {% for cost_type in cost_types %}
                <option value="{{ cost_type }}">
                    {{ cost_type.replace("_", " ").title() }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="manual_costs-{{ row_index }}-amount">
                Monto (COP)
            </label>

            <input
                id="manual_costs-{{ row_index }}-amount"
                name="manual_costs-{{ row_index }}-amount"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="Ej.: 294360"
                required>
        </div>

        <div class="field field-full">
            <label for="manual_costs-{{ row_index }}-description">
                Descripción
            </label>

            <input
                id="manual_costs-{{ row_index }}-description"
                name="manual_costs-{{ row_index }}-description"
                type="text"
                maxlength="200"
                placeholder="Ej.: Maquila integral: trilla, clasificación, tostión, molienda y empaque."
                required>
        </div>

        <div class="field">
            <label for="manual_costs-{{ row_index }}-supplier_party_id">
                Proveedor / tercero
            </label>

            <select
                id="manual_costs-{{ row_index }}-supplier_party_id"
                name="manual_costs-{{ row_index }}-supplier_party_id">
                <option value="">No asociado a tercero</option>

                {% for party in parties %}
                <option value="{{ party.id }}">
                    {{ party.legal_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="manual_costs-{{ row_index }}-supplier_document_number">
                Factura o referencia
            </label>

            <input
                id="manual_costs-{{ row_index }}-supplier_document_number"
                name="manual_costs-{{ row_index }}-supplier_document_number"
                type="text"
                maxlength="40"
                placeholder="Opcional">
        </div>

        <div class="field field-full">
            <label for="manual_costs-{{ row_index }}-notes">Notas</label>

            <input
                id="manual_costs-{{ row_index }}-notes"
                name="manual_costs-{{ row_index }}-notes"
                type="text"
                maxlength="500"
                placeholder="Ej.: Costo histórico reconstruido; valor soportado por comprobante o conversación con proveedor.">
        </div>
    </div>
</div>
