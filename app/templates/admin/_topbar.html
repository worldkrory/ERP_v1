<header class="dn-admin-topbar">
  <div class="dn-admin-topbar-brand">
    <a
  href="{{ url_for('index') }}"
  class="dn-admin-topbar-mark"
  aria-label="Ir al inicio de Densa Niebla"
>
  <svg
    class="dn-admin-topbar-symbol"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="28 0 155 138"
    fill="none"
    aria-hidden="true"
    focusable="false"
  >
    <g
      stroke="currentColor"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <!-- Ala, cuerpo y contorno principal -->
      <path d="M89 90 40 36 106 48 133 98 54 121 89 90Z"/>

      <!-- Ala elevada -->
      <path d="M63 40 46 10 106 48"/>

      <!-- Pliegue del ala -->
      <path d="M63 40 89 90 115 68"/>

      <!-- Cabeza, pico y cuello -->
      <path d="M89 90 141 48 171 59 151 63 133 98"/>

      <!-- Separación del pico -->
      <path d="M153 51 151 63"/>

      <!-- Cola -->
      <path d="M89 90 75 126 54 121"/>
    </g>

    <circle
      cx="143"
      cy="57"
      r="1.8"
      fill="currentColor"
    />
  </svg>
</a>

    <div>
      <strong>Densa Niebla</strong>
      <span>Centro de Operaciones</span>
    </div>
  </div>

  <div class="dn-admin-topbar-status">
    <span class="dn-admin-health-dot" aria-hidden="true"></span>
    <span>Sistema local activo</span>
  </div>

  <div class="dn-admin-topbar-actions">
    {% if current_admin_user and current_admin_user.is_authenticated %}
    <span class="dn-admin-user">
      {{ current_admin_user.email }}
    </span>
    {% endif %}

    <button type="button"
            class="dn-admin-menu-toggle"
            aria-label="Abrir menú"
            aria-expanded="false"
            data-admin-menu-toggle>
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
