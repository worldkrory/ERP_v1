<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Origen no encontrado | Densa Niebla</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --ink: #0b0c0a;
      --paper: #f4efe5;
      --gold: #d8b763;
      --gold-light: #f0d38d;
      --muted: #bdb7a8;
      --line: rgba(216, 183, 99, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      color: var(--paper);
      background:
        radial-gradient(
          circle at 75% 20%,
          rgba(216, 183, 99, 0.16),
          transparent 25rem
        ),
        var(--ink);
      font-family: Montserrat, Arial, sans-serif;
    }

    main {
      width: min(720px, calc(100% - 2.5rem));
      padding: 3rem 0;
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 1rem 0;
      color: var(--gold-light);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(4.5rem, 13vw, 10rem);
      font-weight: 500;
      letter-spacing: -0.08em;
      line-height: 0.72;
    }

    p {
      max-width: 470px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.95rem 1.2rem;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-size: 0.69rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    a:hover,
    a:focus-visible {
      color: var(--ink);
      background: var(--gold-light);
      outline: none;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">Densa Niebla · Café de finca</p>

    <h1>404</h1>

    <p>
      Este origen no está disponible aquí. Vuelve a la colección para
      encontrar un café que sí pueda llegar a tu taza.
    </p>

    <a href="{{ url_for('storefront.collection') }}">
      Ver la colección
    </a>
  </main>
</body>
</html>
