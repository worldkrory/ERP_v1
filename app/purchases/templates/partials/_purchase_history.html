<section class="dn-sales-list">
  <header class="dn-section-header">
    <h2>Compras recientes</h2>

    <span class="dn-section-note">
      Recepciona para crear existencias
    </span>
  </header>

  <div class="dn-table-scroll">
    <table
      class="dn-sales-table"
      aria-label="Compras recientes"
    >
      <thead>
        <tr>
          <th scope="col">Producto</th>
          <th scope="col">Tipo</th>
          <th scope="col">Proveedor</th>
          <th scope="col">Fecha</th>
          <th scope="col">Total</th>
          <th scope="col">Estado</th>
          <th scope="col">
            <span class="dn-table-muted">Acciones</span>
          </th>
        </tr>
      </thead>

      <tbody id="history">
        <tr>
          <td colspan="7" class="dn-empty">
            Cargando...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
